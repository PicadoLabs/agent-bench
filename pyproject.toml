[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbench"
version = "1.0.0"
description = "Provider-agnostic evaluation and benchmarking platform for autonomous AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "PicadoLabs", email = "picadolabs@gmail.com" }
]
maintainers = [
    { name = "PicadoLabs", email = "picadolabs@gmail.com" }
]
keywords = [
    "ai",
    "benchmarking",
    "coding-agents",
    "evaluation",
    "llm",
    "ollama",
    "sandbox",
    "software-engineering"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "typer[all]>=0.9.0",
    "rich>=13.7.1",
    "pyyaml>=6.0.1",
    "docker>=7.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "psutil>=5.9.8",
    "python-dotenv>=1.0.1",
    "aiofiles>=23.2.1"
]

[project.optional-dependencies]
test = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "anyio>=4.0.0"
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[project.urls]
Homepage = "https://picadolabs.me"
Repository = "https://github.com/PicadoLabs/Agent-Bench"
Documentation = "https://github.com/PicadoLabs/Agent-Bench#readme"
"Issue Tracker" = "https://github.com/PicadoLabs/Agent-Bench/issues"
Organization = "https://github.com/PicadoLabs"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]

