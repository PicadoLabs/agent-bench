id: fix-auth-jwt
name: Fix JWT Authentication & Token Security
description: Fix signature verification, algorithm confusion (alg:none), and expiration validation in AuthService.
category: Bug Fixing
difficulty: Medium

repository:
  type: local
  path: benchmarks/repos/auth-jwt-service
  commit: HEAD

task:
  prompt: |
    In auth_service.py, the `verify_token` method has severe security vulnerabilities:
    1. It fails to reject tokens with algorithm "none".
    2. It does not compute or compare the HMAC-SHA256 signature using `self.secret_key` and `hmac.compare_digest`.
    3. It ignores the expiration timestamp (`exp`) in the payload, allowing expired tokens to pass.
    4. Tampered tokens or tokens signed with a different key are not rejected.

    Investigate `auth_service.py` and fix `verify_token` so that:
    - Only HS256 algorithm is accepted.
    - Signatures are strictly verified with HMAC-SHA256 using `hmac.compare_digest`.
    - Expired tokens (`exp` < current time) return None.
    - Malformed or tampered tokens return None.
    Do not modify test_auth.py.

  constraints: |
    - Use Python standard libraries (hmac, hashlib, json, base64, time).
    - Do not modify test files.

evaluation:
  command: pytest test_auth.py
  timeout: 60

scoring:
  correctness: 50
  test_pass_rate: 25
  code_quality: 10
  efficiency: 10
  reliability: 5
